services:
  qwertylearner:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8990:5173'
    env_file:
      - .env
    environment:
      # Consumed by envsubst when nginx starts (see default.conf.template).
      - SPEECH_REGION=${SPEECH_REGION}
      - SPEECH_KEY=${SPEECH_KEY}
    volumes:
      # Mount dictionaries at runtime so updates take effect without rebuilding the image.
      - ./public/dicts:/app/dicts:ro
    restart: unless-stopped
